name: PR19 hygiene normalization temporary

on:
  push:
    branches: [reliability/backup-restore-evidence]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/backup-restore-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply safe lint fixes
        run: pnpm --filter @event-commerce/cloud-api exec eslint src test --fix
      - name: Normalize repository formatting
        run: pnpm exec prettier --write "apps/**/*.{ts,tsx,mjs}" "packages/**/*.{ts,tsx}" "scripts/*.mjs" eslint.config.mjs
      - name: Commit normalization and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages scripts eslint.config.mjs
          git rm .github/workflows/normalize-pr19-temp.yml
          git diff --cached --check
          git commit -m "Normalize backup restore branch hygiene"
          git push origin HEAD:reliability/backup-restore-evidence
