name: Runtime container build

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'apps/cloud-api/**'
      - 'apps/event-edge/**'
      - 'apps/control-web/**'
      - 'packages/contracts/**'
      - 'packages/domain/**'
      - '.github/workflows/container-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Cloud API image
        run: docker build --target cloud-api --tag event-commerce-cloud-api:ci .
      - name: Build Event Edge image
        run: docker build --target event-edge --tag event-commerce-event-edge:ci .
      - name: Build Control Web image
        run: docker build --target control-web --tag event-commerce-control-web:ci .
