name: CI
on:
  pull_request:
  push:
    branches: [main, task/002-event-location-catalogue-clean]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://event_commerce:event_commerce@localhost:5432/event_commerce_test
      EDGE_FORWARDER_DISABLED: 'true'
    services:
      postgres:
        image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_DB: event_commerce_test
          POSTGRES_USER: event_commerce
          POSTGRES_PASSWORD: event_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_commerce -d event_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify immutable workflow dependencies
        run: node scripts/check-workflow-pins.mjs
      - run: pnpm install --frozen-lockfile
      - name: Verify Hostinger portable Control Web output without build target env
        working-directory: apps/control-web
        run: |
          pnpm run build
          test -f .hostinger-output/.next/BUILD_ID
          test -d .hostinger-output/node_modules
          rm -rf /tmp/hostinger-nodejs
          mkdir -p /tmp/hostinger-nodejs
          cp -R .hostinger-output/. /tmp/hostinger-nodejs/
          cd /tmp/hostinger-nodejs
          node -e "require.resolve('next'); console.log('Hostinger runtime can resolve next')"
          cd "$GITHUB_WORKSPACE"
          rm -rf apps/control-web/.hostinger-output
          git checkout -- apps/control-web/next-env.d.ts apps/control-web/tsconfig.json
          pnpm install --frozen-lockfile
      - run: pnpm --filter @event-commerce/cloud-api db:migrate
      - run: pnpm --filter @event-commerce/event-edge db:migrate
      - name: Verify applied migration drift fails closed
        run: |
          printf '\n-- CI migration drift probe\n' >> apps/cloud-api/migrations/0001_event_configuration.sql
          if pnpm --filter @event-commerce/cloud-api db:migrate; then
            echo '::error::Cloud migration runner accepted changed bytes for an applied migration'
            exit 1
          fi
          git checkout -- apps/cloud-api/migrations/0001_event_configuration.sql

          printf '\n-- CI migration drift probe\n' >> apps/event-edge/migrations/0001_sync.sql
          if pnpm --filter @event-commerce/event-edge db:migrate; then
            echo '::error::Event Edge migration runner accepted changed bytes for an applied migration'
            exit 1
          fi
          git checkout -- apps/event-edge/migrations/0001_sync.sql

          pnpm --filter @event-commerce/cloud-api db:migrate
          pnpm --filter @event-commerce/event-edge db:migrate
          git diff --exit-code
      - name: Verify migration history completeness fails closed
        run: |
          mv apps/cloud-api/migrations/0001_event_configuration.sql /tmp/cloud-0001.sql
          if pnpm --filter @event-commerce/cloud-api db:migrate; then
            echo '::error::Cloud migration runner accepted a missing applied migration file'
            exit 1
          fi
          mv /tmp/cloud-0001.sql apps/cloud-api/migrations/0001_event_configuration.sql

          printf '%s\n' '-- CI out-of-order backfill probe' 'SELECT 1;' > apps/cloud-api/migrations/0000_ci_backfill.sql
          if pnpm --filter @event-commerce/cloud-api db:migrate; then
            echo '::error::Cloud migration runner accepted an out-of-order backfilled migration'
            exit 1
          fi
          rm apps/cloud-api/migrations/0000_ci_backfill.sql

          mv apps/event-edge/migrations/0001_sync.sql /tmp/edge-0001.sql
          if pnpm --filter @event-commerce/event-edge db:migrate; then
            echo '::error::Event Edge migration runner accepted a missing applied migration file'
            exit 1
          fi
          mv /tmp/edge-0001.sql apps/event-edge/migrations/0001_sync.sql

          printf '%s\n' '-- CI out-of-order backfill probe' 'SELECT 1;' > apps/event-edge/migrations/0000_ci_backfill.sql
          if pnpm --filter @event-commerce/event-edge db:migrate; then
            echo '::error::Event Edge migration runner accepted an out-of-order backfilled migration'
            exit 1
          fi
          rm apps/event-edge/migrations/0000_ci_backfill.sql

          pnpm --filter @event-commerce/cloud-api db:migrate
          pnpm --filter @event-commerce/event-edge db:migrate
          git diff --exit-code
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm arch:check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.11.1'
      - run: gradle -p apps/pos-android testDebugUnitTest lintDebug --stacktrace

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.11.1'
      - run: pnpm install --frozen-lockfile
      - name: Scan resolved npm and Android dependencies
        run: pnpm security:sca
      - name: Upload SCA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        with:
          name: sca-evidence
          path: artifacts/sca/*.json
          if-no-files-found: warn
          retention-days: 30
