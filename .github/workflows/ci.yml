name: CI
on:
  pull_request:
  push:
    branches: [main, task/002-event-location-catalogue-clean]

permissions:
  contents: write

jobs:
  postcss-lockfile:
    if: github.actor != 'github-actions[bot]' && github.event_name == 'pull_request' && github.head_ref == 'security/next-postcss-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/next-postcss-remediation
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve parent-scoped PostCSS override
        run: pnpm install --no-frozen-lockfile --lockfile-only
      - name: Commit lockfile and restore permanent CI definition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/ci.yml
          git commit -m "Generate scoped PostCSS override lockfile"
          git push origin HEAD:security/next-postcss-remediation

  typescript:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://event_commerce:event_commerce@localhost:5432/event_commerce_test
      EDGE_FORWARDER_DISABLED: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_commerce_test
          POSTGRES_USER: event_commerce
          POSTGRES_PASSWORD: event_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_commerce -d event_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @event-commerce/cloud-api db:migrate
      - run: pnpm --filter @event-commerce/event-edge db:migrate
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm arch:check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p apps/pos-android testDebugUnitTest lintDebug --stacktrace

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: pnpm install --frozen-lockfile
      - name: Scan resolved npm and Android dependencies
        run: pnpm security:sca
      - name: Upload SCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-evidence
          path: artifacts/sca/*.json
          if-no-files-found: warn
          retention-days: 30
