name: Disposable controlled-pilot provider callback probe

on:
  push:
    branches:
      - agent/controlled-pilot-provider-callback-probe

permissions:
  contents: read

jobs:
  provider-callback-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Write bounded callback probe
        run: |
          mkdir -p artifacts/pilot/provider-callback
          cat > artifacts/pilot/provider-callback/body.json <<'JSON'
          {
            "Body": {
              "stkCallback": {
                "MerchantRequestID": "ECOS-ABUSE-PROBE-752830F",
                "CheckoutRequestID": "ECOS-ABUSE-PROBE-752830F",
                "ResultCode": 1032,
                "ResultDesc": "Controlled non-success callback used only for bounded rate-limit evidence"
              }
            }
          }
          JSON
          cat > artifacts/pilot/provider-callback/config.json <<'JSON'
          {
            "schemaVersion": 1,
            "releaseCommit": "752830f740eef5418630a6288e6abb3ea36b4926",
            "scenarioId": "mpesa-provider-callback-burst",
            "targetRole": "PROVIDER_CALLBACK",
            "environment": "controlled-pilot",
            "targetOwnershipAcknowledged": true,
            "url": "https://api-event.nairobuy.com/payments/providers/mpesa/callback",
            "method": "POST",
            "contentType": "application/json",
            "bodyFile": "body.json",
            "totalRequests": 80,
            "concurrency": 10,
            "requestTimeoutMs": 5000,
            "recovery": true
          }
          JSON
      - name: Run bounded callback probe
        run: node scripts/http-abuse-probe.mjs artifacts/pilot/provider-callback/config.json artifacts/pilot/provider-callback/report.json
      - name: Require provider-callback throttle and recovery
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/pilot/provider-callback/report.json', 'utf8'));
          if (report.releaseCommit !== '752830f740eef5418630a6288e6abb3ea36b4926') throw new Error('release mismatch');
          if (report.targetRole !== 'PROVIDER_CALLBACK') throw new Error('target role mismatch');
          if (!report.observedRateLimitPolicies.includes('PROVIDER_CALLBACK')) throw new Error('PROVIDER_CALLBACK policy not observed');
          if (report.rateLimitedCount < 1) throw new Error('provider callback rate limit did not engage');
          if (report.transportErrorCount !== 0) throw new Error(`transport errors: ${report.transportErrorCount}`);
          if (report.successCount < 1) throw new Error('no successful callback responses observed');
          if (report.recovery?.attempted !== true || report.recovery.status < 200 || report.recovery.status >= 300) {
            throw new Error(`recovery failed: ${JSON.stringify(report.recovery)}`);
          }
          console.log(JSON.stringify({
            requestCount: report.requestCount,
            successCount: report.successCount,
            rateLimitedCount: report.rateLimitedCount,
            transportErrorCount: report.transportErrorCount,
            observedRateLimitPolicies: report.observedRateLimitPolicies,
            observedConcurrencyLimits: report.observedConcurrencyLimits,
            retryAfterSeconds: report.retryAfterSeconds,
            recovery: report.recovery
          }));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controlled-pilot-provider-callback-752830f740eef5418630a6288e6abb3ea36b4926
          path: artifacts/pilot/provider-callback/report.json
          if-no-files-found: error
          retention-days: 30
