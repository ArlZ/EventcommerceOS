name: Operator sign-in format

on:
  push:
    branches:
      - agent/operator-sign-in

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/operator-sign-in
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Format operator sign-in files
        run: >-
          pnpm exec prettier --write
          apps/cloud-api/src/auth/operator-cookie.ts
          apps/cloud-api/src/auth/operator-identity.guard.ts
          apps/cloud-api/src/auth/operator-login.service.ts
          apps/cloud-api/src/auth/supabase-auth.transport.ts
          apps/cloud-api/test/operator-login.test.ts
          apps/control-web/src/app/app-shell.tsx
          apps/control-web/src/app/operator-session-control.tsx
          apps/control-web/src/app/sign-in/sign-in-client.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/cloud-api/src/auth/operator-cookie.ts \
            apps/cloud-api/src/auth/operator-identity.guard.ts \
            apps/cloud-api/src/auth/operator-login.service.ts \
            apps/cloud-api/src/auth/supabase-auth.transport.ts \
            apps/cloud-api/test/operator-login.test.ts \
            apps/control-web/src/app/app-shell.tsx \
            apps/control-web/src/app/operator-session-control.tsx \
            apps/control-web/src/app/sign-in/sign-in-client.tsx
          git commit -m 'Format secure operator sign-in'
          git push origin HEAD:agent/operator-sign-in
