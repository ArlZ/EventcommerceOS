name: Task005Repair

on:
  push:
    branches:
      - "task/005-inventory-ledger-alerts"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/005-inventory-ledger-alerts
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/task005_repair.py
      - run: pnpm install --no-frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/cloud-api/src/inventory/inventory.service.ts
          apps/event-edge/src/inventory/*.ts
          apps/event-edge/src/sync/device-sync.controller.ts
          apps/event-edge/test/inventory-alerts.integration.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair Task 005 injection and conflict semantics"
          git push origin HEAD:task/005-inventory-ledger-alerts
