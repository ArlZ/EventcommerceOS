name: Task006AttemptIdentityRepair
on:
  push:
    branches: [task/006-payment-domain-mpesa]
    paths:
      - '.github/workflows/task006-attempt-identity-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/006-payment-domain-mpesa
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/task006_attempt_identity_repair.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/cloud-api/src/payments/payment.service.ts
      - run: |
          rm scripts/task006_attempt_identity_repair.py
          rm .github/workflows/task006-attempt-identity-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud-api/src/payments/payment.service.ts scripts/task006_attempt_identity_repair.py .github/workflows/task006-attempt-identity-repair.yml
          git commit -m "Use client-originated payment attempt identity"
          git push origin HEAD:task/006-payment-domain-mpesa
