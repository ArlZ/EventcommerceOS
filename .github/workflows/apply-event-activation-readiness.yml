name: Apply event activation readiness

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/event-activation-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/apply-event-activation-readiness.py
      - run: pnpm exec prettier --write apps/cloud-api/src/configuration/configuration.service.ts apps/cloud-api/test/pos-menu-publication.integration.test.ts
      - run: git rm .github/scripts/apply-event-activation-readiness.py .github/workflows/apply-event-activation-readiness.yml
      - name: Commit product diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/cloud-api/src/configuration/configuration.service.ts apps/cloud-api/test/pos-menu-publication.integration.test.ts
          git commit -m 'Guard event activation on installed POS menus'
          git push origin HEAD:${{ github.head_ref }}
