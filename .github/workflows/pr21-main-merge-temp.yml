name: PR21 main merge temporary

on:
  push:
    branches: [reliability/backup-restore-smoke-ci]

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/backup-restore-smoke-ci
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-edit origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Merge conflicts:"
            git diff --name-only --diff-filter=U
            git status --short
            exit "$status"
          fi
      - name: Self-remove and push
        run: |
          git rm .github/workflows/pr21-main-merge-temp.yml
          git commit -m "Remove temporary PR21 main merge workflow"
          git push origin HEAD:reliability/backup-restore-smoke-ci
