name: PR94 UI format

on:
  push:
    branches:
      - agent/control-ui-workflow-polish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/control-ui-workflow-polish
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Format Event Control workflow files
        run: >-
          pnpm exec prettier --write
          apps/control-web/src/app/event-context.ts
          apps/control-web/src/app/inventory/inventory-operations-client.tsx
          apps/control-web/src/app/inventory/page.tsx
          apps/control-web/src/app/sync-health/page.tsx
          apps/control-web/src/app/sync-health/sync-health-client.tsx
          apps/control-web/src/app/workflow-ui.tsx
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/control-web/src/app/event-context.ts \
            apps/control-web/src/app/inventory/inventory-operations-client.tsx \
            apps/control-web/src/app/inventory/page.tsx \
            apps/control-web/src/app/sync-health/page.tsx \
            apps/control-web/src/app/sync-health/sync-health-client.tsx \
            apps/control-web/src/app/workflow-ui.tsx; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/control-web/src/app/event-context.ts \
            apps/control-web/src/app/inventory/inventory-operations-client.tsx \
            apps/control-web/src/app/inventory/page.tsx \
            apps/control-web/src/app/sync-health/page.tsx \
            apps/control-web/src/app/sync-health/sync-health-client.tsx \
            apps/control-web/src/app/workflow-ui.tsx
          git commit -m "Format Event Control workflow UI"
          git push origin HEAD:agent/control-ui-workflow-polish
