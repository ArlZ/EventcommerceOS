name: Temporary Prettier capture

on:
  push:
    branches:
      - agent/pilot-ui-command-close

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: >-
          pnpm exec prettier --write
          apps/control-web/src/app/command-centre/command-centre-client.tsx
          apps/control-web/src/app/event-close/event-close-client.tsx
      - name: Emit formatted Command Centre
        run: |
          echo 'BEGIN_COMMAND_CENTRE_BASE64'
          base64 -w0 apps/control-web/src/app/command-centre/command-centre-client.tsx
          echo
          echo 'END_COMMAND_CENTRE_BASE64'
      - name: Emit formatted Event Close
        run: |
          echo 'BEGIN_EVENT_CLOSE_BASE64'
          base64 -w0 apps/control-web/src/app/event-close/event-close-client.tsx
          echo
          echo 'END_EVENT_CLOSE_BASE64'
