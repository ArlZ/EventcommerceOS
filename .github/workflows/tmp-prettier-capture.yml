name: Temporary Prettier capture

on:
  push:
    branches:
      - agent/pilot-ui-command-close

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: >-
          pnpm exec prettier --write
          apps/control-web/src/app/command-centre/command-centre-client.tsx
          apps/control-web/src/app/event-close/event-close-client.tsx
      - name: Commit formatter output and remove temporary workflow
        run: |
          rm .github/workflows/tmp-prettier-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/src/app/command-centre/command-centre-client.tsx
          git add apps/control-web/src/app/event-close/event-close-client.tsx
          git add .github/workflows/tmp-prettier-capture.yml
          git commit -m 'Apply Prettier to pilot operations UI'
          git push origin HEAD:agent/pilot-ui-command-close
