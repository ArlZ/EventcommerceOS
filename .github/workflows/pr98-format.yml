name: PR98 exact format

on:
  push:
    branches:
      - agent/control-ui-interaction-safety

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/control-ui-interaction-safety
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Format Event Close exactly
        run: pnpm exec prettier --write apps/control-web/src/app/event-close/event-close-client.tsx
      - name: Commit formatting and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr98-format.yml
          git add apps/control-web/src/app/event-close/event-close-client.tsx
          git commit -m "Format Event Close interaction polish"
          git push origin HEAD:agent/control-ui-interaction-safety
