name: PR10 main merge temporary

on:
  push:
    branches: [codex/task-008-command-centre]

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/task-008-command-centre
          fetch-depth: 0
      - name: Merge current main and resolve verified formatting-only conflict
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-edit origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected="apps/cloud-api/test/pesapal-sabi.provider.test.ts"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              git status --short
              exit 1
            fi
            git checkout --theirs "$expected"
            git add "$expected"
            git commit -m "Merge current main into Task 008"
          fi
      - name: Self-remove and push
        run: |
          git rm .github/workflows/pr10-main-merge-temp.yml
          git commit -m "Remove temporary PR10 main merge workflow"
          git push origin HEAD:codex/task-008-command-centre
