name: Android controlled pilot signed APK

on:
  pull_request:
    paths:
      - 'apps/pos-android/**'
      - '.github/workflows/android-controlled-pilot-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact checked-out release
        run: test "$RELEASE_COMMIT" = "$(git rev-parse HEAD)"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.11.1'
      - name: Create ephemeral PR validation signing key
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair \
            -storetype JKS \
            -keystore "$RUNNER_TEMP/pos-release-ci.jks" \
            -storepass 'ci-release-store-password' \
            -alias 'ci-controlled-pilot' \
            -keypass 'ci-release-key-password' \
            -keyalg RSA \
            -keysize 3072 \
            -validity 7 \
            -dname 'CN=Event Commerce OS CI Validation, O=Event Commerce OS, C=KE'
          {
            echo "POS_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/pos-release-ci.jks"
            echo 'POS_RELEASE_KEYSTORE_PASSWORD=ci-release-store-password'
            echo 'POS_RELEASE_KEY_ALIAS=ci-controlled-pilot'
            echo 'POS_RELEASE_KEY_PASSWORD=ci-release-key-password'
          } >> "$GITHUB_ENV"
      - name: Load controlled pilot signing key
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_B64: ${{ secrets.POS_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POS_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "::error::Controlled-pilot Android signing may only run from main; got $GITHUB_REF"
            exit 1
          fi
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required controlled-pilot Android signing secret $name is not configured"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pos-controlled-pilot-release.jks"
          test -s "$RUNNER_TEMP/pos-controlled-pilot-release.jks"
          {
            echo "POS_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/pos-controlled-pilot-release.jks"
            echo "POS_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "POS_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "POS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Test, lint and build signed release APK
        run: gradle -p apps/pos-android testDebugUnitTest lintRelease assembleRelease --stacktrace
      - name: Verify release signing and non-debuggable manifest
        run: |
          set -euo pipefail
          APK='apps/pos-android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"
          grep -q 'Verifies' "$RUNNER_TEMP/apksigner.txt"
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -1)"
          fi
          test -x "$APKANALYZER"
          DEBUGGABLE="$("$APKANALYZER" manifest debuggable "$APK" | tr -d '\r\n[:space:]')"
          if [ "$DEBUGGABLE" != 'false' ]; then
            echo "::error::Release APK is unexpectedly debuggable: $DEBUGGABLE"
            exit 1
          fi
      - name: Stage controlled pilot release evidence
        run: |
          set -euo pipefail
          APK='apps/pos-android/app/build/outputs/apk/release/app-release.apk'
          OUT='artifacts/controlled-pilot-apk'
          mkdir -p "$OUT"
          cp "$APK" "$OUT/event-commerce-pos-controlled-pilot.apk"
          APK_SHA="$(sha256sum "$OUT/event-commerce-pos-controlled-pilot.apk" | awk '{print $1}')"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$OUT/event-commerce-pos-controlled-pilot.apk" > "$RUNNER_TEMP/apksigner-certs.txt"
          SIGNER_SHA="$(grep -m1 -E 'certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner-certs.txt" | sed -E 's/.*digest:[[:space:]]*//' | tr -d '\r\n[:space:]' | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$SIGNER_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::Unable to extract a valid signer certificate SHA-256 digest'
            cat "$RUNNER_TEMP/apksigner-certs.txt"
            exit 1
          fi
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -1)"
          fi
          test -x "$APKANALYZER"
          APP_ID="$("$APKANALYZER" manifest application-id "$OUT/event-commerce-pos-controlled-pilot.apk" | tr -d '\r\n[:space:]')"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$OUT/event-commerce-pos-controlled-pilot.apk" | tr -d '\r\n[:space:]')"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$OUT/event-commerce-pos-controlled-pilot.apk" | tr -d '\r\n[:space:]')"
          if [ "$APP_ID" != 'com.eventcommerce.pos' ]; then
            echo "::error::Unexpected application id: $APP_ID"
            exit 1
          fi
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo '::error::APK version metadata is missing'
            exit 1
          fi
          printf 'Controlled-pilot APK metadata: app=%s version=%s (%s) signer=%s\n' \
            "$APP_ID" "$VERSION_NAME" "$VERSION_CODE" "$SIGNER_SHA"
          export APK_SHA SIGNER_SHA APP_ID VERSION_NAME VERSION_CODE
          node <<'NODE'
          import { writeFileSync } from 'node:fs';

          const releaseCommit = process.env.RELEASE_COMMIT;
          const requiredSha = (name) => {
            const value = process.env[name];
            if (!/^[0-9a-f]{64}$/.test(value ?? '')) throw new Error(`${name} is invalid`);
            return value;
          };
          if (!/^[0-9a-f]{40}$/.test(releaseCommit ?? '')) {
            throw new Error('RELEASE_COMMIT must be a lowercase 40-character Git SHA');
          }

          const validationOnly = process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch';
          const evidence = {
            schemaVersion: 1,
            releaseCommit,
            workflowRunId: process.env.GITHUB_RUN_ID,
            repository: process.env.GITHUB_REPOSITORY,
            buildType: 'release',
            validationOnly,
            applicationId: process.env.APP_ID,
            versionName: process.env.VERSION_NAME,
            versionCode: process.env.VERSION_CODE,
            apk: {
              name: 'event-commerce-pos-controlled-pilot.apk',
              sha256: requiredSha('APK_SHA'),
              signerCertificateSha256: requiredSha('SIGNER_SHA'),
              signed: true,
              debuggable: false,
            },
            signingKeyClass: validationOnly
              ? 'ephemeral-ci-validation'
              : 'controlled-pilot-secret',
            warning: validationOnly
              ? 'CI validation artifact only. Never install for live-money service.'
              : null,
            builtAt: new Date().toISOString(),
          };
          writeFileSync(
            'artifacts/controlled-pilot-apk/release-manifest.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
            { mode: 0o600 },
          );
          NODE
          sha256sum "$OUT/event-commerce-pos-controlled-pilot.apk" > "$OUT/event-commerce-pos-controlled-pilot.apk.sha256"
      - name: Upload signed release validation artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        with:
          name: event-commerce-pos-signed-release-ci-${{ github.sha }}
          path: artifacts/controlled-pilot-apk/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload controlled pilot signed APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        with:
          name: event-commerce-pos-controlled-pilot-${{ github.sha }}
          path: artifacts/controlled-pilot-apk/*
          if-no-files-found: error
          retention-days: 30
