name: Release gates

on:
  pull_request:

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require the applicable release checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const prNumber = Number(process.env.PR_NUMBER);
          const targetSha = process.env.TARGET_SHA;

          if (!token || !repository || !Number.isInteger(prNumber) || !targetSha) {
            throw new Error('release gate is missing required GitHub event context');
          }

          const [owner, repo] = repository.split('/');
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'event-commerce-release-gate',
          };

          async function request(path) {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`GitHub API ${response.status} for ${path}: ${body.slice(0, 500)}`);
            }
            return response.json();
          }

          async function allPullRequestFiles() {
            const files = [];
            for (let page = 1; ; page += 1) {
              const batch = await request(
                `/repos/${owner}/${repo}/pulls/${prNumber}/files?per_page=100&page=${page}`,
              );
              files.push(...batch);
              if (batch.length < 100) return files;
            }
          }

          async function allCheckRuns() {
            const runs = [];
            for (let page = 1; ; page += 1) {
              const data = await request(
                `/repos/${owner}/${repo}/commits/${targetSha}/check-runs?per_page=100&page=${page}`,
              );
              runs.push(...data.check_runs);
              if (data.check_runs.length < 100) return runs;
            }
          }

          const files = (await allPullRequestFiles()).map((file) => file.filename);

          const runtimeRelevant = files.some(
            (file) =>
              file === 'Dockerfile' ||
              file === '.dockerignore' ||
              file === 'package.json' ||
              file === 'pnpm-lock.yaml' ||
              file === 'pnpm-workspace.yaml' ||
              file === 'tsconfig.base.json' ||
              file === '.github/workflows/container-build.yml' ||
              file.startsWith('apps/cloud-api/') ||
              file.startsWith('apps/event-edge/') ||
              file.startsWith('apps/control-web/') ||
              file.startsWith('packages/contracts/') ||
              file.startsWith('packages/domain/'),
          );

          const recoveryRelevant = files.some(
            (file) =>
              file.startsWith('apps/cloud-api/migrations/') ||
              file === 'apps/cloud-api/scripts/backup-restore-evidence.mjs' ||
              file === 'apps/cloud-api/package.json' ||
              file === 'pnpm-lock.yaml' ||
              file === 'docs/BACKUP_RESTORE.md' ||
              file === 'plans/reliability-backup-restore-evidence.md' ||
              file === 'plans/reliability-backup-restore-smoke-ci.md' ||
              file === '.github/workflows/recovery-smoke.yml',
          );

          const required = ['typescript', 'android', 'sca', 'gitleaks'];
          if (runtimeRelevant) required.push('build-runtime-images');
          if (recoveryRelevant) required.push('backup-restore-smoke');

          console.log(`Changed files: ${files.length}`);
          console.log(`Runtime gate required: ${runtimeRelevant}`);
          console.log(`Backup/restore gate required: ${recoveryRelevant}`);
          console.log(`Required checks: ${required.join(', ')}`);

          const deadline = Date.now() + 30 * 60 * 1000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          while (Date.now() < deadline) {
            const runs = await allCheckRuns();
            const latestByName = new Map();

            for (const run of runs) {
              if (!required.includes(run.name)) continue;
              const current = latestByName.get(run.name);
              if (!current || run.id > current.id) latestByName.set(run.name, run);
            }

            const pending = [];
            for (const name of required) {
              const run = latestByName.get(name);
              if (!run || run.status !== 'completed') {
                pending.push(name);
                continue;
              }
              if (run.conclusion !== 'success') {
                throw new Error(
                  `required check ${name} concluded ${run.conclusion ?? 'without a conclusion'}`,
                );
              }
            }

            if (pending.length === 0) {
              console.log('All applicable release checks passed.');
              process.exit(0);
            }

            console.log(`Waiting for: ${pending.join(', ')}`);
            await sleep(15_000);
          }

          throw new Error(`timed out waiting for required checks: ${required.join(', ')}`);
          NODE
