name: SCA patch remediation temporary

on:
  push:
    branches: [security/sca-moderate-remediation]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://event_commerce:event_commerce@localhost:5432/event_commerce_test
      EDGE_FORWARDER_DISABLED: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_commerce_test
          POSTGRES_USER: event_commerce
          POSTGRES_PASSWORD: event_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_commerce -d event_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sca-moderate-remediation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @event-commerce/cloud-api db:migrate
      - run: pnpm --filter @event-commerce/event-edge db:migrate
      - name: Inspect patched dependency resolution
        run: |
          echo '=== AJV ==='
          pnpm -r why ajv || true
          echo '=== QS ==='
          pnpm -r why qs || true
          echo '=== BODY-PARSER ==='
          pnpm -r why body-parser || true
          echo '=== POSTCSS ==='
          pnpm -r why postcss || true
      - run: pnpm check
      - name: Commit lockfile and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/sca-patch-remediation-temp.yml
          git commit -m "Apply patch-line dependency security updates"
          git push origin HEAD:security/sca-moderate-remediation
