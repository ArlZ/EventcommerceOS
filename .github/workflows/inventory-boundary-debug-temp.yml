name: Inventory boundary diagnostic temporary

on:
  push:
    branches: [security/dependency-sca-evidence]

permissions:
  contents: read

jobs:
  inventory-boundary:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://event_commerce:event_commerce@localhost:5432/event_commerce_test
      EDGE_FORWARDER_DISABLED: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_commerce_test
          POSTGRES_USER: event_commerce
          POSTGRES_PASSWORD: event_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_commerce -d event_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @event-commerce/contracts build
      - run: pnpm --filter @event-commerce/domain build
      - run: pnpm --filter @event-commerce/event-edge db:migrate
      - name: Run focused inventory boundary test
        run: pnpm --filter @event-commerce/event-edge exec vitest run test/inventory-sync-boundary.integration.test.ts --no-file-parallelism
