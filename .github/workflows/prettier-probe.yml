name: Prettier probe

on:
  push:
    branches: [agent/hostinger-static-control-web]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Print canonical formatting diff
        run: |
          pnpm exec prettier --write apps/control-web/test/next-config-security.test.ts scripts/hostinger-managed-webapp.test.mjs
          git diff -- apps/control-web/test/next-config-security.test.ts scripts/hostinger-managed-webapp.test.mjs
