name: Prettier probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          target=apps/cloud-api/scripts/seed-recovery-representative.mjs
          cp "$target" /tmp/seed-recovery-representative.before.mjs
          pnpm exec prettier --write "$target"
          echo '--- BEGIN CANONICAL PRETTIER DIFF ---'
          diff -u /tmp/seed-recovery-representative.before.mjs "$target" || true
          echo '--- END CANONICAL PRETTIER DIFF ---'
          exit 1
