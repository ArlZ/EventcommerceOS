name: Format POS menu install receipts

on:
  push:
    branches:
      - agent/pos-menu-install-receipts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/cloud-api/migrations/0017_pos_menu_install_receipts.sql
          apps/cloud-api/src/security/abuse-protection.guard.ts
          apps/cloud-api/src/sync/pos-menu-install-receipt.service.ts
          apps/cloud-api/src/sync/pos-menu-publication.controller.ts
          apps/cloud-api/src/sync/sync.module.ts
          apps/cloud-api/test/pos-menu-publication-abuse.test.ts
          apps/cloud-api/test/pos-menu-publication.integration.test.ts
          apps/cloud-api/test/sync-device-health.integration.test.ts
          apps/control-web/src/app/configuration/pos-menu-publication-control.tsx
          apps/event-edge/src/pos-menu/cloud-pos-menu.transport.ts
          apps/event-edge/src/pos-menu/pos-menu.controller.ts
          apps/event-edge/test/cloud-pos-menu.transport.test.ts
          apps/event-edge/test/pos-menu-controller.test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "Formatter made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud-api/migrations/0017_pos_menu_install_receipts.sql \
                  apps/cloud-api/src/security/abuse-protection.guard.ts \
                  apps/cloud-api/src/sync/pos-menu-install-receipt.service.ts \
                  apps/cloud-api/src/sync/pos-menu-publication.controller.ts \
                  apps/cloud-api/src/sync/sync.module.ts \
                  apps/cloud-api/test/pos-menu-publication-abuse.test.ts \
                  apps/cloud-api/test/pos-menu-publication.integration.test.ts \
                  apps/cloud-api/test/sync-device-health.integration.test.ts \
                  apps/control-web/src/app/configuration/pos-menu-publication-control.tsx \
                  apps/event-edge/src/pos-menu/cloud-pos-menu.transport.ts \
                  apps/event-edge/src/pos-menu/pos-menu.controller.ts \
                  apps/event-edge/test/cloud-pos-menu.transport.test.ts \
                  apps/event-edge/test/pos-menu-controller.test.ts
          git commit -m "Format POS menu install receipt changes"
          git push origin HEAD:agent/pos-menu-install-receipts
