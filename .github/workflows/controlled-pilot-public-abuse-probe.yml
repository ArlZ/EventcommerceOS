name: Disposable controlled-pilot public abuse probe

on:
  push:
    branches:
      - agent/controlled-pilot-public-abuse-probe

permissions:
  contents: read

jobs:
  public-abuse-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Write bounded probe config
        run: |
          mkdir -p artifacts/pilot/public-abuse
          cat > artifacts/pilot/public-abuse/config.json <<'JSON'
          {
            "schemaVersion": 1,
            "releaseCommit": "752830f740eef5418630a6288e6abb3ea36b4926",
            "scenarioId": "cloud-public-health-burst",
            "targetRole": "CLOUD_PUBLIC",
            "environment": "controlled-pilot",
            "targetOwnershipAcknowledged": true,
            "url": "https://api-event.nairobuy.com/health",
            "method": "GET",
            "totalRequests": 45,
            "concurrency": 10,
            "requestTimeoutMs": 5000,
            "recovery": true
          }
          JSON
      - name: Run bounded public probe
        run: node scripts/http-abuse-probe.mjs artifacts/pilot/public-abuse/config.json artifacts/pilot/public-abuse/report.json
      - name: Require rate limit and recovery
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/pilot/public-abuse/report.json', 'utf8'));
          if (report.releaseCommit !== '752830f740eef5418630a6288e6abb3ea36b4926') throw new Error('release mismatch');
          if (report.targetRole !== 'CLOUD_PUBLIC') throw new Error('target role mismatch');
          if (!report.observedRateLimitPolicies.includes('PUBLIC')) throw new Error('PUBLIC policy header not observed');
          if (report.rateLimitedCount < 1) throw new Error('PUBLIC rate limit did not engage');
          if (report.recovery?.attempted !== true || report.recovery.status < 200 || report.recovery.status >= 300) {
            throw new Error(`recovery failed: ${JSON.stringify(report.recovery)}`);
          }
          console.log(JSON.stringify({
            requestCount: report.requestCount,
            successCount: report.successCount,
            rateLimitedCount: report.rateLimitedCount,
            transportErrorCount: report.transportErrorCount,
            observedRateLimitPolicies: report.observedRateLimitPolicies,
            observedConcurrencyLimits: report.observedConcurrencyLimits,
            retryAfterSeconds: report.retryAfterSeconds,
            recovery: report.recovery
          }));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controlled-pilot-public-abuse-752830f740eef5418630a6288e6abb3ea36b4926
          path: artifacts/pilot/public-abuse/report.json
          if-no-files-found: error
          retention-days: 30
