name: Migration checksum probe

on:
  push:
    branches: [agent/migration-checksum-probe]

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Print Cloud migration SHA-256 checksums
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdir, readFile } from 'node:fs/promises';
          const dir = 'apps/cloud-api/migrations';
          const files = (await readdir(dir)).filter((name) => name.endsWith('.sql')).sort();
          for (const filename of files) {
            const bytes = await readFile(`${dir}/${filename}`);
            const checksum = createHash('sha256').update(bytes).digest('hex');
            console.log(`MIGRATION_CHECKSUM ${filename} ${checksum}`);
          }
          NODE
