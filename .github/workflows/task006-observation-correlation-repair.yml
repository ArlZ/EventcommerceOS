name: Task006ObservationCorrelationRepair
on:
  push:
    branches: [task/006-payment-domain-mpesa]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/006-payment-domain-mpesa
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/task006_backfill_observation_correlation.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/cloud-api/src/payments/payment.service.ts
      - run: |
          rm scripts/task006_backfill_observation_correlation.py
          rm .github/workflows/task006-observation-correlation-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud-api/src/payments/payment.service.ts scripts/task006_backfill_observation_correlation.py .github/workflows/task006-observation-correlation-repair.yml
          git commit -m "Backfill early M-PESA callback correlation safely"
          git push origin HEAD:task/006-payment-domain-mpesa
