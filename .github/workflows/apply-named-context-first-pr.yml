name: Run named context first PR applier

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/named-context-first
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Apply staged transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-named-context-first.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          pnpm exec prettier"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          raw_lines = workflow[start:end].splitlines()
          lines = []
          in_triple = False
          for line in raw_lines:
              if in_triple:
                  lines.append(line)
                  if line.count('"""') % 2 == 1:
                      in_triple = False
                  continue
              normalized = line[10:] if line.startswith('          ') else line
              lines.append(normalized)
              if normalized.count('"""') % 2 == 1:
                  in_triple = True
          script = '\n'.join(lines)
          exec(compile(script, 'named-context-first', 'exec'))
          PY

          pnpm exec prettier --write \
            apps/control-web/src/app/command-centre/command-centre-client.tsx \
            apps/control-web/src/app/inventory/inventory-operations-client.tsx \
            apps/control-web/src/app/sync-health/sync-health-client.tsx \
            apps/control-web/src/app/event-close/event-close-client.tsx \
            apps/control-web/src/app/event-schedule/event-schedule-client.tsx \
            apps/control-web/src/app/operations.css

          git rm .github/workflows/apply-named-context-first.yml \
            .github/workflows/apply-named-context-first-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/src/app/command-centre/command-centre-client.tsx \
            apps/control-web/src/app/inventory/inventory-operations-client.tsx \
            apps/control-web/src/app/sync-health/sync-health-client.tsx \
            apps/control-web/src/app/event-close/event-close-client.tsx \
            apps/control-web/src/app/event-schedule/event-schedule-client.tsx \
            apps/control-web/src/app/operations.css
          git commit -m 'Prefer named Event Control context'
          git push origin HEAD:agent/named-context-first
