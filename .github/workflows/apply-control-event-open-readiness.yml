name: Apply Event Control opening readiness

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/control-event-open-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/apply-control-event-open-readiness.py
      - run: pnpm exec prettier --write apps/control-web/src/app/configuration/pos-menu-publication-control.tsx apps/control-web/src/app/configuration/pos-menu-readiness.ts apps/control-web/test/pos-menu-readiness.test.ts
      - run: pnpm --filter @event-commerce/control-web exec vitest run test/pos-menu-readiness.test.ts
      - run: git rm .github/scripts/apply-control-event-open-readiness.py .github/workflows/apply-control-event-open-readiness.yml
      - name: Commit product diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/control-web/src/app/configuration/pos-menu-publication-control.tsx apps/control-web/src/app/configuration/pos-menu-readiness.ts apps/control-web/test/pos-menu-readiness.test.ts
          git commit -m 'Add explicit ready-to-open event control'
          git push origin HEAD:${{ github.head_ref }}
