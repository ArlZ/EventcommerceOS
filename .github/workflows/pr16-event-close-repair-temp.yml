name: PR16 event close repair temporary

on:
  push:
    branches: [security/cloud-payment-machine-trust]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/cloud-payment-machine-trust
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Backport proven Event Close core fixes
        run: |
          git fetch origin security/human-auth-rbac
          git checkout origin/security/human-auth-rbac -- \
            apps/cloud-api/src/event-close/event-close-ledger.service.ts \
            apps/cloud-api/src/event-close/event-close-cash-count.service.ts
      - name: Normalize changed files
        run: pnpm exec prettier --write apps/cloud-api/src/event-close/event-close-ledger.service.ts apps/cloud-api/src/event-close/event-close-cash-count.service.ts
      - name: Commit repair and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud-api/src/event-close/event-close-ledger.service.ts apps/cloud-api/src/event-close/event-close-cash-count.service.ts
          git rm .github/workflows/pr16-event-close-repair-temp.yml
          git diff --cached --check
          git commit -m "Repair event close correction and reconciliation invariants"
          git push origin HEAD:security/cloud-payment-machine-trust
