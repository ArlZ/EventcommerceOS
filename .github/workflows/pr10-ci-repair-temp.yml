name: PR10 CI repair temporary

on:
  push:
    branches: [codex/task-008-command-centre]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/task-008-command-centre
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Repair Command Centre query and deterministic integration execution
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const servicePath = 'apps/cloud-api/src/command-centre/command-centre.service.ts';
          let source = fs.readFileSync(servicePath, 'utf8');
          source = source.replace(
            "ON location.id::text = state.sales_location_id AND location.event_id = $1::uuid",
            "ON location.id::text = state.sales_location_id AND location.event_id::text = $1",
          );
          fs.writeFileSync(servicePath, source);
          for (const path of ['apps/cloud-api/package.json', 'apps/event-edge/package.json']) {
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.scripts.test = 'vitest run --no-file-parallelism';
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          NODE
      - name: Normalize CI formatting surface
        run: pnpm exec prettier --write "apps/**/*.{ts,tsx,mjs}" "packages/**/*.{ts,tsx}" "scripts/*.mjs" eslint.config.mjs
      - name: Commit repair and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages scripts eslint.config.mjs
          git rm .github/workflows/pr10-ci-repair-temp.yml
          git diff --cached --check
          git commit -m "Repair Command Centre CI correctness"
          git push origin HEAD:codex/task-008-command-centre
