name: PR17 final PR16 merge temporary

on:
  push:
    branches: [security/human-auth-rbac]

permissions:
  contents: write

jobs:
  merge-base:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/human-auth-rbac
          fetch-depth: 0
      - name: Merge final PR16 base with verified resolutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin security/cloud-payment-machine-trust
          set +e
          git merge --no-ff --no-edit origin/security/cloud-payment-machine-trust
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' \
              apps/cloud-api/src/command-centre/command-centre.controller.ts \
              apps/cloud-api/src/command-centre/command-centre.service.ts \
              apps/cloud-api/src/event-close/event-close.controller.ts | sort)"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours apps/cloud-api/src/command-centre/command-centre.controller.ts
            git checkout --ours apps/cloud-api/src/command-centre/command-centre.service.ts
            git checkout --ours apps/cloud-api/src/event-close/event-close.controller.ts
            git add apps/cloud-api/src/command-centre/command-centre.controller.ts \
                    apps/cloud-api/src/command-centre/command-centre.service.ts \
                    apps/cloud-api/src/event-close/event-close.controller.ts
            git commit --no-edit
          fi
      - name: Self-remove and push
        run: |
          git rm .github/workflows/pr17-pr16-merge-temp.yml
          git commit -m "Remove temporary PR17 final PR16 merge workflow"
          git push origin HEAD:security/human-auth-rbac
