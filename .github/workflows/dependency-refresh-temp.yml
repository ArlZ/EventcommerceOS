name: Dependency remediation temporary

on:
  push:
    branches: [security/dependency-sca-evidence]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-sca-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Refresh compatible security-sensitive parents
        run: |
          pnpm -w up vitest@3.2.7
          pnpm --filter @event-commerce/cloud-api up @nestjs/common@10.4.22 @nestjs/core@10.4.22 @nestjs/platform-express@10.4.22 @nestjs/testing@10.4.22
          pnpm --filter @event-commerce/event-edge up @nestjs/common@10.4.22 @nestjs/core@10.4.22 @nestjs/platform-express@10.4.22 @nestjs/testing@10.4.22
          pnpm --filter @event-commerce/control-web up next@15.5.22
      - name: Apply exact transitive security floors and integration correction
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const rootPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          pkg.pnpm = {
            ...(pkg.pnpm ?? {}),
            overrides: {
              ...(pkg.pnpm?.overrides ?? {}),
              'glob@10.4.5': '10.5.0',
              'picomatch@4.0.1': '4.0.5',
              'postcss@8.4.31': '8.5.18',
              'sharp@0.34.5': '0.35.0',
              'tmp@0.0.33': '0.2.6'
            }
          };
          fs.writeFileSync(rootPath, `${JSON.stringify(pkg, null, 2)}\n`);

          const androidPath = 'apps/pos-android/app/build.gradle.kts';
          let android = fs.readFileSync(androidPath, 'utf8');
          const robolectric = '  testImplementation("org.robolectric:robolectric:4.14.1")';
          const securityFloor = '  testImplementation("org.bouncycastle:bcprov-jdk18on:1.80.2")';
          if (!android.includes(securityFloor)) {
            if (!android.includes(robolectric)) throw new Error('Robolectric dependency anchor not found');
            android = android.replace(robolectric, `${robolectric}\n${securityFloor}`);
          }
          fs.writeFileSync(androidPath, android);

          const closeTestPath = 'apps/cloud-api/test/event-close.integration.test.ts';
          let closeTest = fs.readFileSync(closeTestPath, 'utf8');
          const oldAssertion = "expect(Buffer.from(csv.body).toString('utf8')).toContain('FINANCIAL_RECONCILIATION');";
          const newAssertion = "expect(csv.text).toContain('FINANCIAL_RECONCILIATION');";
          if (closeTest.includes(oldAssertion)) closeTest = closeTest.replace(oldAssertion, newAssertion);
          else if (!closeTest.includes(newAssertion)) throw new Error('Event Close CSV assertion anchor not found');
          fs.writeFileSync(closeTestPath, closeTest);
          NODE
          pnpm install --no-frozen-lockfile
      - name: Commit resolved remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml apps/cloud-api/package.json apps/event-edge/package.json apps/control-web/package.json apps/pos-android/app/build.gradle.kts apps/cloud-api/test/event-close.integration.test.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Remediate dependency security findings"
          git push origin HEAD:security/dependency-sca-evidence
