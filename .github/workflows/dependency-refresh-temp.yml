name: Dependency refresh temporary

on:
  push:
    branches: [security/dependency-sca-evidence]

permissions:
  contents: read

jobs:
  npm-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Refresh compatible security-sensitive parents
        run: |
          pnpm -w up vitest@3.2.7
          pnpm --filter @event-commerce/cloud-api up @nestjs/common@10.4.22 @nestjs/core@10.4.22 @nestjs/platform-express@10.4.22 @nestjs/testing@10.4.22
          pnpm --filter @event-commerce/event-edge up @nestjs/common@10.4.22 @nestjs/core@10.4.22 @nestjs/platform-express@10.4.22 @nestjs/testing@10.4.22
          pnpm --filter @event-commerce/control-web up next@15.5.22
      - name: Capture refreshed manifests and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dependency-refresh
          path: |
            package.json
            apps/cloud-api/package.json
            apps/event-edge/package.json
            apps/control-web/package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1

  android-insight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Trace vulnerable Bouncy Castle dependency
        run: |
          gradle -p apps/pos-android app:dependencyInsight --dependency bcprov-jdk18on --configuration debugUnitTestRuntimeClasspath > bcprov-insight.txt
          cat bcprov-insight.txt
      - name: Upload dependency insight
        uses: actions/upload-artifact@v4
        with:
          name: android-dependency-insight
          path: bcprov-insight.txt
          if-no-files-found: error
          retention-days: 1
