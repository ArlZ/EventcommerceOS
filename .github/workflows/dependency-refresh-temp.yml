name: Final dependency floor refresh

on:
  push:
    branches: [security/dependency-sca-evidence]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-sca-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply final advisory floors
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.pnpm = pkg.pnpm ?? {};
          pkg.pnpm.overrides = pkg.pnpm.overrides ?? {};
          pkg.pnpm.overrides['multer@2.0.2'] = '2.2.0';
          pkg.pnpm.overrides['tmp@0.0.33'] = '0.2.7';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --no-frozen-lockfile
      - name: Commit final dependency resolution and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git rm .github/workflows/dependency-refresh-temp.yml
          git diff --cached --check
          git commit -m "Raise final dependency security floors"
          git push origin HEAD:security/dependency-sca-evidence
