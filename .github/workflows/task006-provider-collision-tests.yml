name: Task006ProviderCollisionTests
on:
  push:
    branches: [task/006-payment-domain-mpesa]
    paths:
      - '.github/workflows/task006-provider-collision-tests.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/006-payment-domain-mpesa
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/task006_provider_collision_tests.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/cloud-api/test/payment-orchestration.integration.test.ts
      - run: |
          rm scripts/task006_provider_collision_tests.py
          rm .github/workflows/task006-provider-collision-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud-api/test/payment-orchestration.integration.test.ts scripts/task006_provider_collision_tests.py .github/workflows/task006-provider-collision-tests.yml
          git commit -m "Test provider payment identifier collision quarantine"
          git push origin HEAD:task/006-payment-domain-mpesa
