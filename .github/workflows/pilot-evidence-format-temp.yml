name: Pilot evidence formatting temporary

on:
  push:
    branches: [reliability/pilot-evidence-pack]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: reliability/pilot-evidence-pack
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/pilot-evidence.mjs scripts/pilot-evidence.test.mjs
      - name: Commit formatting and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/pilot-evidence.mjs scripts/pilot-evidence.test.mjs
          git rm .github/workflows/pilot-evidence-format-temp.yml
          git commit -m "Format pilot evidence tooling"
          git push origin HEAD:reliability/pilot-evidence-pack
