name: PR16 final PR15 merge temporary

on:
  push:
    branches: [security/cloud-payment-machine-trust]

permissions:
  contents: write

jobs:
  merge-base:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/cloud-payment-machine-trust
          fetch-depth: 0
      - name: Merge final PR15 base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin security/pos-edge-trust
          set +e
          git merge --no-ff --no-edit origin/security/pos-edge-trust
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Merge conflicts:"
            git diff --name-only --diff-filter=U
            git status --short
            exit "$status"
          fi
      - name: Self-remove and push
        run: |
          git rm .github/workflows/pr16-pr15-merge-temp.yml
          git commit -m "Remove temporary PR16 final PR15 merge workflow"
          git push origin HEAD:security/cloud-payment-machine-trust
