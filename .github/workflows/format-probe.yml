name: Disposable Prettier probe

on:
  push:
    branches:
      - agent/hostinger-cloud-migrate-before-bootstrap

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Emit exact Prettier output
        run: |
          pnpm exec prettier apps/cloud-api/test/managed-hostinger-migration.test.ts --write
          echo '---BEGIN-PRETTIER---'
          cat apps/cloud-api/test/managed-hostinger-migration.test.ts
          echo '---END-PRETTIER---'
