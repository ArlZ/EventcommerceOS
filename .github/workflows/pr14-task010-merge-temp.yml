name: PR14 Task 010 merge temporary

on:
  push:
    branches: [security/edge-cloud-trust]

permissions:
  contents: write

jobs:
  merge-base:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/edge-cloud-trust
          fetch-depth: 0
      - name: Merge final Task 010 base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/task-010-production-hardening
          set +e
          git merge --no-ff --no-edit origin/codex/task-010-production-hardening
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Merge conflicts:"
            git diff --name-only --diff-filter=U
            git status --short
            exit "$status"
          fi
      - name: Self-remove and push
        run: |
          git rm .github/workflows/pr14-task010-merge-temp.yml
          git commit -m "Remove temporary PR14 Task 010 merge workflow"
          git push origin HEAD:security/edge-cloud-trust
