# Registered workflow trigger
name: Nest 11 remediation temporary

on:
  push:
    branches: [security/nest11-sca-remediation]

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://event_commerce:event_commerce@localhost:5432/event_commerce_test
      EDGE_FORWARDER_DISABLED: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_commerce_test
          POSTGRES_USER: event_commerce
          POSTGRES_PASSWORD: event_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_commerce -d event_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nest11-sca-remediation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: pnpm install --frozen-lockfile
      - name: Resolve current Nest 11 versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          COMMON="$(pnpm view @nestjs/common version)"
          CORE="$(pnpm view @nestjs/core version)"
          PLATFORM="$(pnpm view @nestjs/platform-express version)"
          TESTING="$(pnpm view @nestjs/testing version)"
          CLI="$(pnpm view @nestjs/cli version)"
          for pair in "common:$COMMON" "core:$CORE" "platform-express:$PLATFORM" "testing:$TESTING" "cli:$CLI"; do
            name="${pair%%:*}"
            version="${pair#*:}"
            case "$version" in
              11.*) ;;
              *) echo "Refusing unexpected latest @nestjs/$name major: $version" >&2; exit 1 ;;
            esac
          done
          printf 'Resolved Nest versions: common=%s core=%s platform-express=%s testing=%s cli=%s\n' "$COMMON" "$CORE" "$PLATFORM" "$TESTING" "$CLI"
          echo "common=$COMMON" >> "$GITHUB_OUTPUT"
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "testing=$TESTING" >> "$GITHUB_OUTPUT"
          echo "cli=$CLI" >> "$GITHUB_OUTPUT"
      - name: Upgrade Cloud and Edge to Nest 11
        shell: bash
        run: |
          set -euo pipefail
          COMMON='${{ steps.versions.outputs.common }}'
          CORE='${{ steps.versions.outputs.core }}'
          PLATFORM='${{ steps.versions.outputs.platform }}'
          TESTING='${{ steps.versions.outputs.testing }}'
          CLI='${{ steps.versions.outputs.cli }}'
          for workspace in @event-commerce/cloud-api @event-commerce/event-edge; do
            pnpm --filter "$workspace" add --save-exact \
              "@nestjs/common@$COMMON" \
              "@nestjs/core@$CORE" \
              "@nestjs/platform-express@$PLATFORM"
            pnpm --filter "$workspace" add --save-dev --save-exact \
              "@nestjs/testing@$TESTING" \
              "@nestjs/cli@$CLI"
          done
          pnpm install --frozen-lockfile
      - run: pnpm --filter @event-commerce/cloud-api db:migrate
      - run: pnpm --filter @event-commerce/event-edge db:migrate
      - name: Run full workspace validation
        run: pnpm check
      - name: Measure SCA after Nest 11
        run: pnpm security:sca
      - name: Commit validated Nest 11 upgrade and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud-api/package.json apps/event-edge/package.json pnpm-lock.yaml
          git rm .github/workflows/nest11-remediation-temp.yml
          git commit -m "Upgrade Nest runtime and tooling to 11"
          git push origin HEAD:security/nest11-sca-remediation
