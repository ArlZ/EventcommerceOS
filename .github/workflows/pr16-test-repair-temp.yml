name: PR16 test repair temporary

on:
  push:
    branches: [security/cloud-payment-machine-trust]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/cloud-payment-machine-trust
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply minimal proven test/query fixes
        run: |
          git fetch origin security/human-auth-rbac
          node <<'NODE'
          const fs = require('node:fs');

          const commandPath = 'apps/cloud-api/src/command-centre/command-centre.service.ts';
          let command = fs.readFileSync(commandPath, 'utf8');
          command = command.replace(
            "ON location.id::text = state.sales_location_id AND location.event_id = $1::uuid",
            "ON location.id::text = state.sales_location_id AND location.event_id::text = $1",
          );
          fs.writeFileSync(commandPath, command);

          const closePath = 'apps/cloud-api/test/event-close.integration.test.ts';
          let closeTest = fs.readFileSync(closePath, 'utf8');
          closeTest = closeTest.replace(
            "expect(Buffer.from(csv.body).toString('utf8')).toContain('FINANCIAL_RECONCILIATION');",
            "expect(csv.text).toContain('FINANCIAL_RECONCILIATION');",
          );
          fs.writeFileSync(closePath, closeTest);
          NODE

          git checkout origin/security/human-auth-rbac -- \
            apps/event-edge/test/pos-device-auth-testkit.ts \
            apps/event-edge/test/pos-device-auth.integration.test.ts \
            apps/event-edge/test/sync.integration.test.ts \
            apps/event-edge/test/sync-conflict-watermark.integration.test.ts \
            apps/event-edge/test/inventory-sync-boundary.integration.test.ts
      - name: Normalize changed files
        run: |
          pnpm exec prettier --write \
            apps/cloud-api/src/command-centre/command-centre.service.ts \
            apps/cloud-api/test/event-close.integration.test.ts \
            apps/event-edge/test/pos-device-auth-testkit.ts \
            apps/event-edge/test/pos-device-auth.integration.test.ts \
            apps/event-edge/test/sync.integration.test.ts \
            apps/event-edge/test/sync-conflict-watermark.integration.test.ts \
            apps/event-edge/test/inventory-sync-boundary.integration.test.ts
      - name: Commit repair and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud-api apps/event-edge
          git rm .github/workflows/pr16-test-repair-temp.yml
          git diff --cached --check
          git commit -m "Repair cloud payment machine trust integration fixtures"
          git push origin HEAD:security/cloud-payment-machine-trust
