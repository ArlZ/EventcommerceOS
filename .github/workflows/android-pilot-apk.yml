name: Android pilot APK

on:
  pull_request:
    paths:
      - 'apps/pos-android/**'
      - '.github/workflows/android-pilot-apk.yml'
  push:
    branches: [main]
    paths:
      - 'apps/pos-android/**'
      - '.github/workflows/android-pilot-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.11.1'
      - name: Test, lint and build pilot APK
        run: gradle -p apps/pos-android testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Stage pilot artifact and checksum
        run: |
          mkdir -p artifacts/pilot-apk
          cp apps/pos-android/app/build/outputs/apk/debug/app-debug.apk artifacts/pilot-apk/event-commerce-pos-pilot-debug.apk
          sha256sum artifacts/pilot-apk/event-commerce-pos-pilot-debug.apk > artifacts/pilot-apk/event-commerce-pos-pilot-debug.apk.sha256
      - name: Upload pilot APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        with:
          name: event-commerce-pos-pilot-apk
          path: artifacts/pilot-apk/*
          if-no-files-found: error
          retention-days: 14
