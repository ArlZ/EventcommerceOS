name: Android debug rehearsal APK

on:
  pull_request:
    paths:
      - 'apps/pos-android/**'
      - '.github/workflows/android-pilot-apk.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact checked-out release
        run: |
          test "$RELEASE_COMMIT" = "$(git rev-parse HEAD)"
          printf 'Building debug rehearsal APK for exact commit %s\n' "$RELEASE_COMMIT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.11.1'
      - name: Test, lint and build debug rehearsal APK
        run: gradle -p apps/pos-android testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Stage exact-release debug rehearsal evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/debug-rehearsal-apk
          apk=artifacts/debug-rehearsal-apk/event-commerce-pos-debug-rehearsal.apk
          cp apps/pos-android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          digest="$(sha256sum "$apk" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$(basename "$apk")" > "$apk.sha256"
          APK_SHA256="$digest" node <<'NODE'
          import { writeFileSync } from 'node:fs';

          const releaseCommit = process.env.RELEASE_COMMIT;
          const apkSha256 = process.env.APK_SHA256;
          if (!/^[0-9a-f]{40}$/.test(releaseCommit ?? '')) {
            throw new Error('RELEASE_COMMIT must be an exact lowercase 40-character Git SHA');
          }
          if (!/^[0-9a-f]{64}$/.test(apkSha256 ?? '')) {
            throw new Error('APK_SHA256 must be a lowercase SHA-256 digest');
          }

          const evidence = {
            schemaVersion: 1,
            releaseCommit,
            workflowRunId: process.env.GITHUB_RUN_ID,
            repository: process.env.GITHUB_REPOSITORY,
            buildType: 'debug-rehearsal',
            liveMoneyApproved: false,
            apk: {
              file: 'event-commerce-pos-debug-rehearsal.apk',
              sha256: apkSha256,
            },
            warning:
              'Debug rehearsal artifact only. Do not use for live-money service; use the signed controlled-pilot release workflow.',
            builtAt: new Date().toISOString(),
          };
          writeFileSync(
            'artifacts/debug-rehearsal-apk/release-manifest.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
            { mode: 0o600 },
          );
          NODE
      - name: Upload debug rehearsal APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        with:
          name: event-commerce-pos-debug-rehearsal-${{ github.sha }}
          path: artifacts/debug-rehearsal-apk/*
          if-no-files-found: error
          retention-days: 30
