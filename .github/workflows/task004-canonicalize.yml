name: Task 004 Canonicalize
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.12.1 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write "apps/**/*.{ts,tsx,mjs}" "packages/**/*.{ts,tsx}" "scripts/*.mjs" eslint.config.mjs
      - name: Commit canonical Task 004 files
        shell: bash
        run: |
          git add \
            pnpm-lock.yaml \
            apps/cloud-api/src/sync/cloud-sync.service.ts \
            apps/cloud-api/src/sync/sync-validation.ts \
            apps/cloud-api/test/sync-invalid.integration.test.ts \
            apps/cloud-api/test/sync.integration.test.ts \
            apps/control-web/src/app/sync-health/sync-health-client.tsx \
            apps/event-edge/scripts/migrate.mjs \
            apps/event-edge/src/database/database.service.ts \
            apps/event-edge/src/sync/cloud-forwarder.service.ts \
            apps/event-edge/src/sync/device-sync.service.ts \
            apps/event-edge/src/sync/http-cloud-sync.transport.ts \
            apps/event-edge/src/sync/safe-device-sync.service.ts \
            apps/event-edge/src/sync/sync-validation.ts \
            apps/event-edge/test/sync.integration.test.ts
          if git diff --cached --quiet; then
            echo "Canonical files already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canonicalize Task 004 formatting and lockfile"
          git push origin HEAD:${{ github.head_ref }}
