name: Abuse evidence format once

on:
  push:
    branches:
      - agent/abuse-field-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/abuse-field-evidence
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          pnpm exec prettier --write \
            scripts/http-abuse-probe.mjs \
            scripts/abuse-field-evidence.mjs \
            scripts/abuse-field-evidence.test.mjs
          if git diff --quiet -- \
            scripts/http-abuse-probe.mjs \
            scripts/abuse-field-evidence.mjs \
            scripts/abuse-field-evidence.test.mjs; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/http-abuse-probe.mjs \
            scripts/abuse-field-evidence.mjs \
            scripts/abuse-field-evidence.test.mjs
          git commit -m 'Format abuse field evidence'
          git push origin HEAD:agent/abuse-field-evidence
