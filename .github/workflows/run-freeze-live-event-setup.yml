name: Run live event Setup safeguard

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/freeze-live-event-setup
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: python .github/freeze-live-event-setup.py
      - run: pnpm exec prettier --write apps/control-web/src/app/configuration/configuration-client.tsx apps/control-web/src/app/configuration/event-configuration.ts apps/control-web/test/event-configuration.test.ts
      - name: Verify lifecycle guard tests
        run: pnpm --filter @event-commerce/control-web exec vitest run test/event-configuration.test.ts
      - name: Commit product changes
        shell: bash
        run: |
          git rm .github/freeze-live-event-setup.py .github/workflows/run-freeze-live-event-setup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/src/app/configuration/configuration-client.tsx apps/control-web/src/app/configuration/event-configuration.ts apps/control-web/test/event-configuration.test.ts
          git commit -m 'Keep live event setup read only'
          git push origin HEAD:agent/freeze-live-event-setup
