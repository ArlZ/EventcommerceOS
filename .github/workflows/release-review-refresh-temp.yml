name: Release review refresh temporary

on:
  push:
    branches: [docs/release-readiness-refresh]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/release-readiness-refresh
      - name: Refresh merged-stack release status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/RELEASE_SECURITY_REVIEW.md')
          s = p.read_text()
          replacements = {
            "**Status: remediated across `security/cloud-payment-machine-trust` and `security/human-auth-rbac`, pending stack merge and exact-release acceptance.**": "**Status: remediated and merged into `main`; exact-release operational acceptance remains required.**",
            "**Status: remediated in `security/edge-cloud-trust`, pending stack merge and exact-release acceptance.**": "**Status: remediated and merged into `main`; exact-release operational acceptance remains required.**",
            "**Status: remediated in `security/human-auth-rbac`, pending stack merge and exact-release acceptance.**": "**Status: remediated and merged into `main`; exact-release operational acceptance remains required.**",
            "**Status: remediated in `security/pos-edge-trust`, pending stack merge and exact-release acceptance.**": "**Status: remediated and merged into `main`; exact-release operational acceptance remains required.**",
            "**Status: remediated at application/code level in `security/abuse-controls`, pending stack merge and deployment evidence.**": "**Status: remediated at application/code level and merged into `main`; real deployment/flood evidence remains required.**",
            "**Status: executable in `reliability/backup-restore-evidence`, but not closed until a representative release-candidate restore drill passes and is signed off.**": "**Status: executable with a permanent synthetic regression smoke merged into `main`; not closed until a representative release-candidate restore drill passes and is signed off.**",
            "**Status: prior runner-allocation blocker closed; permanent GitHub Actions jobs now receive runners and execute.**": "**Status: runner-allocation blocker closed; permanent TypeScript/Android/SCA CI has executed green on the fully merged application/security stack. Exact-release enforcement still requires protected-branch policy.**",
            "**Status: executable and producing real PASS evidence; exact-release retention plus named reviewer sign-off remain mandatory.**": "**Status: executable and producing real PASS evidence on the merged stack; exact-release retention plus named reviewer sign-off remain mandatory.**",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
              s = s.replace(old, new, 1)

          marker = "## Positive controls already present"
          section = """### SEC-009 — P1 — Repository merge-gate enforcement\n\n**Status: open. `main` is currently unprotected and GitHub does not enforce required status checks or pull-request-only changes.**\n\nThe repository's CI, Android, SCA and recovery-smoke workflows are now executable and have passed on the integrated stack. However, repository policy does not currently prevent a future direct push or merge that bypasses those checks. That makes the release gate procedural rather than technically enforced.\n\nBefore a live-money pilot candidate is approved, protect `main` so at minimum:\n\n- changes reach `main` through pull requests rather than direct pushes;\n- the permanent CI checks are required before merge, including TypeScript/architecture, Android and SCA;\n- the recovery smoke is required when its protected paths change;\n- force pushes and branch deletion are disabled for normal maintainers;\n- any emergency bypass is restricted, attributable and reviewed after use.\n\nBranch protection is a repository-administration control and is not implemented by application code. A green workflow run is evidence that checks pass; it is not evidence that GitHub will require them on every future merge.\n\n"""
          if marker not in s:
              raise SystemExit('positive controls marker missing')
          if '### SEC-009 — P1 — Repository merge-gate enforcement' not in s:
              s = s.replace(marker, section + marker, 1)

          old_disposition = """SEC-001 through SEC-005 are closed at code/review level in the stacked security branches, subject to exact-release CI acceptance and stack merge. SEC-006 has an executable evidence mechanism but no representative signed restore PASS yet. SEC-007's runner-allocation problem is closed and permanent CI is executable. SEC-008 is producing real zero-blocker SCA evidence, but exact-release retention and named sign-off remain release requirements. SEC-005 additionally requires deployment-mode/flood-exercise evidence on the real pilot topology; multi-instance production requires the documented upstream distributed boundary.\n\nRemaining mandatory release blockers are:\n\n1. SEC-006 executed representative backup/restore PASS evidence, RPO/RTO/cadence proof and named sign-off;\n2. one consolidated green permanent TypeScript + format + architecture + Android + SCA CI result on the exact release candidate;\n3. SEC-008 exact-release SCA PASS evidence with no unaccepted HIGH/CRITICAL/UNKNOWN finding and named review sign-off;\n4. SEC-005 real deployment abuse/flood evidence before live exposure;\n5. real supported-device, event-network, Edge-hardware and provider fault/reconciliation evidence from `docs/PILOT_RUNBOOK.md`.\n"""
          new_disposition = """SEC-001 through SEC-005 are merged into `main` and closed at application/code-review level. The fully integrated stack has also passed permanent TypeScript/build/lint/typecheck/tests/format/architecture, Android and fail-closed SCA gates, and the permanent synthetic backup/restore smoke has passed. Those results materially improve release confidence, but they do not convert deployment or operator evidence into code evidence. SEC-006 still lacks a representative signed restore PASS. SEC-005 still requires deployment-mode/flood evidence on the actual pilot topology. SEC-008 still requires exact-release evidence retention and named review. SEC-009 remains open because `main` is not protected, so future CI compliance is not repository-enforced.\n\nRemaining mandatory release blockers are:\n\n1. enable and verify `main` branch protection / required checks so release gates cannot be routinely bypassed (SEC-009);\n2. execute a representative SEC-006 backup/restore drill on the exact release candidate, proving RPO/RTO/cadence and obtaining named operator/reviewer sign-off;\n3. retain one consolidated green permanent TypeScript + format + architecture + Android + SCA result on the exact release candidate and obtain the required release review;\n4. retain exact-release SEC-008 SCA PASS evidence with no unaccepted HIGH/CRITICAL/UNKNOWN finding and named review sign-off;\n5. execute SEC-005 deployment abuse/flood evidence on the real pilot topology before live exposure;\n6. complete the supported-device, event-network, Edge-hardware and provider fault/reconciliation evidence in `docs/PILOT_RUNBOOK.md`.\n"""
          if old_disposition not in s:
              raise SystemExit('release disposition block not found')
          s = s.replace(old_disposition, new_disposition, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASE_SECURITY_REVIEW.md
          git commit -m "Refresh integrated release security disposition"
      - name: Self-remove and push
        run: |
          git rm .github/workflows/release-review-refresh-temp.yml
          git commit -m "Remove temporary release review refresh workflow"
          git push origin HEAD:docs/release-readiness-refresh
