name: PR18 CI repair temporary

on:
  push:
    branches: [security/abuse-controls]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/abuse-controls
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Backport proven non-backup correctness fixes
        run: |
          git fetch origin reliability/backup-restore-evidence
          git checkout origin/reliability/backup-restore-evidence -- \
            apps/cloud-api/src/auth/operator-identity.guard.ts \
            apps/cloud-api/src/command-centre/command-centre.controller.ts \
            apps/cloud-api/src/command-centre/command-centre.service.ts \
            apps/cloud-api/src/event-close/event-close-audit-csv.service.ts \
            apps/cloud-api/src/event-close/event-close-cash-count.service.ts \
            apps/cloud-api/src/event-close/event-close-ledger.service.ts \
            apps/cloud-api/src/event-close/event-close.controller.ts \
            apps/cloud-api/src/security/abuse-concurrency.interceptor.ts \
            apps/cloud-api/src/security/abuse-protection.guard.ts \
            apps/cloud-api/src/security/global-security.guard.ts \
            apps/cloud-api/test/command-centre.integration.test.ts \
            apps/cloud-api/test/event-close.integration.test.ts \
            apps/cloud-api/test/operator-auth-testkit.ts \
            apps/cloud-api/test/operator-auth.integration.test.ts \
            apps/cloud-api/test/payment-machine-auth.integration.test.ts \
            apps/cloud-api/test/pesapal-sabi.provider.test.ts \
            apps/cloud-api/test/sync-auth-testkit.ts \
            apps/event-edge/test/inventory-sync-boundary.integration.test.ts \
            apps/event-edge/test/pos-device-auth-testkit.ts \
            apps/event-edge/test/pos-device-auth.integration.test.ts \
            apps/event-edge/test/sync-conflict-watermark.integration.test.ts \
            apps/event-edge/test/sync.integration.test.ts
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ['apps/cloud-api/package.json', 'apps/event-edge/package.json']) {
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.scripts.test = 'vitest run --no-file-parallelism';
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          NODE
      - name: Normalize backport formatting
        run: |
          pnpm exec prettier --write \
            apps/cloud-api/src/auth/operator-identity.guard.ts \
            apps/cloud-api/src/command-centre/command-centre.controller.ts \
            apps/cloud-api/src/command-centre/command-centre.service.ts \
            apps/cloud-api/src/event-close/event-close-audit-csv.service.ts \
            apps/cloud-api/src/event-close/event-close-cash-count.service.ts \
            apps/cloud-api/src/event-close/event-close-ledger.service.ts \
            apps/cloud-api/src/event-close/event-close.controller.ts \
            apps/cloud-api/src/security/abuse-concurrency.interceptor.ts \
            apps/cloud-api/src/security/abuse-protection.guard.ts \
            apps/cloud-api/src/security/global-security.guard.ts \
            apps/cloud-api/test/command-centre.integration.test.ts \
            apps/cloud-api/test/event-close.integration.test.ts \
            apps/cloud-api/test/operator-auth-testkit.ts \
            apps/cloud-api/test/operator-auth.integration.test.ts \
            apps/cloud-api/test/payment-machine-auth.integration.test.ts \
            apps/cloud-api/test/pesapal-sabi.provider.test.ts \
            apps/cloud-api/test/sync-auth-testkit.ts \
            apps/event-edge/test/inventory-sync-boundary.integration.test.ts \
            apps/event-edge/test/pos-device-auth-testkit.ts \
            apps/event-edge/test/pos-device-auth.integration.test.ts \
            apps/event-edge/test/sync-conflict-watermark.integration.test.ts \
            apps/event-edge/test/sync.integration.test.ts \
            apps/cloud-api/package.json \
            apps/event-edge/package.json
      - name: Commit repair and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud-api apps/event-edge
          git rm .github/workflows/pr18-ci-repair-temp.yml
          git diff --cached --check
          git commit -m "Backport proven CI correctness fixes to abuse controls stack"
          git push origin HEAD:security/abuse-controls
