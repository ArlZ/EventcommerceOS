name: Task006OrchestratorRepair

on:
  push:
    branches:
      - "task/006-payment-domain-mpesa"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/006-payment-domain-mpesa
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/task006_orchestrator_repair.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/cloud-api/src/payments/payment.service.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Task 006 payment dispatch idempotency"
          git push origin HEAD:task/006-payment-domain-mpesa
