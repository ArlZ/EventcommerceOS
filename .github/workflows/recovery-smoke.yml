name: Backup restore smoke

on:
  pull_request:
    paths:
      - 'apps/cloud-api/migrations/**'
      - 'apps/cloud-api/scripts/backup-restore-evidence.mjs'
      - 'apps/cloud-api/scripts/seed-recovery-representative.mjs'
      - 'apps/cloud-api/package.json'
      - 'pnpm-lock.yaml'
      - 'docs/BACKUP_RESTORE.md'
      - 'plans/reliability-backup-restore-evidence.md'
      - 'plans/reliability-backup-restore-smoke-ci.md'
      - '.github/workflows/recovery-smoke.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://event_commerce:event_commerce@localhost:5432/event_commerce_test
      RESTORE_DATABASE_URL: postgresql://event_commerce:event_commerce@localhost:5433/event_commerce_restore
      RESTORE_TARGET_RESET_ACK: RESET:event_commerce_restore
      RECOVERY_FIXTURE_ACK: SEED:event_commerce_test
      RECOVERY_FIXTURE_ORDER_COUNT: '250'
      BACKUP_OPERATOR: ci-representative-recovery-drill
      RELEASE_COMMIT_SHA: ${{ github.sha }}
      BACKUP_RPO_TARGET_MINUTES: '60'
      BACKUP_RTO_TARGET_MINUTES: '10'
      BACKUP_REQUIRE_REPRESENTATIVE_DATA: 'true'
      BACKUP_KEEP_DUMP: 'false'
      BACKUP_OUTPUT_DIR: artifacts/backup-restore-smoke
    services:
      source-db:
        image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_DB: event_commerce_test
          POSTGRES_USER: event_commerce
          POSTGRES_PASSWORD: event_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_commerce -d event_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      restore-db:
        image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_DB: event_commerce_restore
          POSTGRES_USER: event_commerce
          POSTGRES_PASSWORD: event_commerce
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U event_commerce -d event_commerce_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact checked-out release
        run: test "$RELEASE_COMMIT_SHA" = "$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @event-commerce/cloud-api db:migrate
      - name: Seed guarded representative recovery fixture
        run: pnpm --filter @event-commerce/cloud-api recovery:seed-representative
      - name: Run representative backup restore drill
        run: pnpm --filter @event-commerce/cloud-api backup-restore-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        if: always()
        with:
          name: backup-restore-smoke-evidence-${{ github.sha }}
          path: apps/cloud-api/artifacts/backup-restore-smoke/**
          if-no-files-found: warn
          retention-days: 30
