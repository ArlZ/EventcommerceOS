name: Fix close readiness description

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/action-first-close
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Make close readiness description state-aware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/control-web/src/app/event-close/event-close-client.tsx')
          text = path.read_text()
          old = '              description="Start with what still needs action, then decide whether to close now or resolve it first."\n'
          new = """              description={
                isOperationallyClosed
                  ? 'Review what changed after the stored close before deciding whether an audited reopen is needed.'
                  : 'Start with what still needs action, then decide whether to close now or resolve it first.'
              }
"""
          if old not in text:
              raise SystemExit('Missing close readiness description')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/control-web/src/app/event-close/event-close-client.tsx
          git rm .github/workflows/fix-close-readiness-description.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/src/app/event-close/event-close-client.tsx
          git commit -m 'Keep close readiness state-aware'
          git push origin HEAD:agent/action-first-close
