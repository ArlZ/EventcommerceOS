name: Cloud convergence format probe

on:
  pull_request:
    paths:
      - '.github/workflows/cloud-convergence-format-probe.yml'
      - 'apps/cloud-api/scripts/cloud-convergence-snapshot.mjs'
      - 'scripts/cloud-convergence-evidence.mjs'
      - 'scripts/cloud-convergence-evidence.test.mjs'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier patch
        run: |
          pnpm exec prettier --write \
            apps/cloud-api/scripts/cloud-convergence-snapshot.mjs \
            scripts/cloud-convergence-evidence.mjs \
            scripts/cloud-convergence-evidence.test.mjs
          git diff -- \
            apps/cloud-api/scripts/cloud-convergence-snapshot.mjs \
            scripts/cloud-convergence-evidence.mjs \
            scripts/cloud-convergence-evidence.test.mjs
