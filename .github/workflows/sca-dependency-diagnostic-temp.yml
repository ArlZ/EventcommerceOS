name: SCA dependency diagnostic temporary

on:
  push:
    branches: [security/sca-moderate-remediation]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sca-moderate-remediation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Map vulnerable npm dependency chains
        run: |
          echo '=== AJV ==='
          pnpm -r why ajv || true
          echo '=== QS ==='
          pnpm -r why qs || true
          echo '=== FILE-TYPE ==='
          pnpm -r why file-type || true
          echo '=== POSTCSS ==='
          pnpm -r why postcss || true
          echo '=== NEST CORE ==='
          pnpm -r why @nestjs/core || true
          echo '=== BODY-PARSER ==='
          pnpm -r why body-parser || true
      - name: Self-remove diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sca-dependency-diagnostic-temp.yml
          git commit -m "Remove temporary SCA dependency diagnostic"
          git push origin HEAD:security/sca-moderate-remediation
