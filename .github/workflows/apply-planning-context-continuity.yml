name: Apply planning context continuity

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/auto-load-planning-context
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Apply planning context continuity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing expected snippet: {label}")
              return text.replace(old, new, 1)

          setup = Path('apps/control-web/src/app/configuration/configuration-client.tsx')
          text = setup.read_text()
          text = replace_once(
              text,
              "  const [status, setStatus] = useState('Start by creating or loading the event organisation.');\n  const [busy, setBusy] = useState(false);",
              "  const [status, setStatus] = useState('Start by creating or loading the event organisation.');\n  const [contextHydrated, setContextHydrated] = useState(false);\n  const [busy, setBusy] = useState(false);",
              'setup hydration state',
          )
          text = replace_once(
              text,
              "    if (context.organisationId) setOrganisationId(context.organisationId);\n    if (context.eventId) setEventId(context.eventId);\n  }, []);\n\n  async function refresh",
              "    if (context.organisationId) setOrganisationId(context.organisationId);\n    if (context.eventId) setEventId(context.eventId);\n    setContextHydrated(true);\n  }, []);\n\n  useEffect(() => {\n    if (!contextHydrated || !organisationId.trim()) return;\n    void refresh(organisationId);\n  }, [contextHydrated]);\n\n  async function refresh",
              'setup automatic context load',
          )
          text = replace_once(
              text,
              "                Create a new pilot operator or load an existing organisation by its setup ID. The\n                last organisation used elsewhere in Event Control is carried into this screen for\n                the current browser tab.",
              "                Create a new pilot operator or load an existing organisation by its setup ID. When\n                Event Control already has an organisation selected, its setup loads automatically;\n                use the ID field below only to switch or retry.",
              'setup automatic load guidance',
          )
          setup.write_text(text)

          schedule = Path('apps/control-web/src/app/event-schedule/event-schedule-client.tsx')
          text = schedule.read_text()
          text = replace_once(
              text,
              "  const [busy, setBusy] = useState(false);\n  const [status, setStatus] = useState('Load an organisation to review its event schedule.');",
              "  const [busy, setBusy] = useState(false);\n  const [contextHydrated, setContextHydrated] = useState(false);\n  const [status, setStatus] = useState('Load an organisation to review its event schedule.');",
              'schedule hydration state',
          )
          text = replace_once(
              text,
              "    if (context.organisationName) {\n      setStatus(`Ready to load ${context.organisationName} schedules.`);\n    }\n  }, []);\n\n  const activeEvents",
              "    if (context.organisationName) {\n      setStatus(`Loading ${context.organisationName} schedules…`);\n    }\n    setContextHydrated(true);\n  }, []);\n\n  useEffect(() => {\n    if (!contextHydrated || !organisationId.trim()) return;\n    void loadOrganisation(organisationId);\n  }, [contextHydrated]);\n\n  const activeEvents",
              'schedule automatic context load',
          )
          text = replace_once(
              text,
              "              Use the same organisation setup ID used in Event Control. The last organisation used\n              elsewhere in Event Control is carried into this screen for the current browser tab.",
              "              The organisation selected elsewhere in Event Control loads automatically. Use the\n              setup ID below only when you need to switch organisation or retry a failed load.",
              'schedule automatic load guidance',
          )
          schedule.write_text(text)
          PY

          pnpm exec prettier --write \
            apps/control-web/src/app/configuration/configuration-client.tsx \
            apps/control-web/src/app/event-schedule/event-schedule-client.tsx

          git rm .github/workflows/apply-planning-context-continuity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/src/app/configuration/configuration-client.tsx \
            apps/control-web/src/app/event-schedule/event-schedule-client.tsx
          git commit -m 'Auto-load planning context in Event Control'
          git push origin HEAD:agent/auto-load-planning-context
