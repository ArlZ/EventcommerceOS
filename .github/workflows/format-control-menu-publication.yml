name: Format control menu publication

on:
  push:
    branches:
      - agent/control-publish-pos-menu

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/control-web/src/app/configuration/page.tsx
          apps/control-web/src/app/configuration/pos-menu-publication-control.tsx
          apps/control-web/src/app/event-context.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "Formatter made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-web/src/app/configuration/page.tsx \
                  apps/control-web/src/app/configuration/pos-menu-publication-control.tsx \
                  apps/control-web/src/app/event-context.ts
          git commit -m "Format POS menu publication UI"
          git push origin HEAD:agent/control-publish-pos-menu
