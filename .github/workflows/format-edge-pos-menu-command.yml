name: Format Edge POS menu command

on:
  push:
    branches:
      - agent/edge-pos-menu-operator-command

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format operator command
        run: pnpm exec prettier --write apps/event-edge/scripts/manage-pos-menu.mjs apps/event-edge/test/pos-menu-operator-script.test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "Formatter made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/event-edge/scripts/manage-pos-menu.mjs apps/event-edge/test/pos-menu-operator-script.test.ts
          git commit -m "Format Edge POS menu operator command"
          git push origin HEAD:agent/edge-pos-menu-operator-command
