name: Format runtime monitor

on:
  push:
    branches:
      - reliability/runtime-monitor-probe
    paths:
      - scripts/runtime-monitor.mjs
      - scripts/runtime-monitor.test.mjs
      - .github/workflows/format-runtime-monitor.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: reliability/runtime-monitor-probe

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format runtime monitor files
        run: pnpm exec prettier --write scripts/runtime-monitor.mjs scripts/runtime-monitor.test.mjs

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- scripts/runtime-monitor.mjs scripts/runtime-monitor.test.mjs; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/runtime-monitor.mjs scripts/runtime-monitor.test.mjs
          git commit -m "Format runtime monitor with pinned Prettier"
          git push origin HEAD:reliability/runtime-monitor-probe
