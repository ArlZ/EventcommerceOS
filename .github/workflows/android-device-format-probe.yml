name: Android device format probe

on:
  pull_request:
    paths:
      - 'scripts/android-device-evidence.mjs'
      - 'scripts/android-device-evidence.test.mjs'
      - '.github/workflows/android-device-format-probe.yml'

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Print authoritative Prettier diff
        run: |
          pnpm exec prettier --write scripts/android-device-evidence.mjs scripts/android-device-evidence.test.mjs
          git diff --no-ext-diff -- scripts/android-device-evidence.mjs scripts/android-device-evidence.test.mjs
