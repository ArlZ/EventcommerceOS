name: Event Edge pilot bundle

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'apps/event-edge/**'
      - 'infra/edge-pilot/**'
      - '.github/workflows/edge-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/event-edge/**'
      - 'infra/edge-pilot/**'
      - '.github/workflows/edge-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate pilot helper syntax
        run: |
          node --check infra/edge-pilot/bootstrap.mjs
          node --check infra/edge-pilot/rehearsal.mjs
      - name: Validate venue Compose configuration
        env:
          RELEASE_COMMIT: 1111111111111111111111111111111111111111
          CLOUD_API_URL: https://cloud-pilot.invalid
          EDGE_ID: edge-ci-placeholder
          EDGE_CLOUD_SYNC_TOKEN: edge-cloud-test-token-placeholder-0000
          EDGE_LOCAL_ADMIN_TOKEN: local-admin-test-token-placeholder-0000
          EDGE_POSTGRES_PASSWORD: postgres-test-password-placeholder-0000
          PILOT_EVENT_ID: 11111111-1111-4111-8111-111111111111
          PILOT_EVENT_END_AT: '2026-08-27T02:00:00+03:00'
          PILOT_SALES_LOCATION_ID: 22222222-2222-4222-8222-222222222222
          PILOT_INVENTORY_LOCATION_ID: 33333333-3333-4333-8333-333333333333
          PILOT_SKU_ID: 44444444-4444-4444-8444-444444444444
          PILOT_OPERATOR_ACTOR_ID: 55555555-5555-4555-8555-555555555555
          PILOT_OPENING_STOCK_BASE: '100'
          PILOT_OPENING_STOCK_OCCURRED_AT: '2026-08-26T17:00:00+03:00'
        run: docker compose -f infra/edge-pilot/compose.yml config --quiet
