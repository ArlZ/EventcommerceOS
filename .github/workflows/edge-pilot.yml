name: Event Edge pilot bundle

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'apps/event-edge/**'
      - 'infra/edge-pilot/**'
      - '.github/workflows/edge-pilot.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact checked-out release
        run: test "$RELEASE_COMMIT" = "$(git rev-parse HEAD)"
      - name: Validate pilot helper syntax
        shell: pwsh
        run: |
          node --check infra/edge-pilot/bootstrap.mjs
          node --check infra/edge-pilot/field-diagnostics.mjs
          node --check infra/edge-pilot/rehearsal.mjs
          node --check infra/edge-pilot/verify-lan-https.mjs
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'infra/edge-pilot/prepare-lan-https.ps1',
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate Caddy HTTPS configuration
        run: |
          docker run --rm \
            -e EDGE_LAN_HOST=192.0.2.10 \
            -v "$PWD/infra/edge-pilot/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify no-SNI clients receive the LAN IP certificate
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name edge-caddy-tls-ci \
            -e EDGE_LAN_HOST=192.0.2.10 \
            -p 18443:443 \
            -v "$PWD/infra/edge-pilot/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine
          trap 'docker rm -f edge-caddy-tls-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec edge-caddy-tls-ci test -f /data/caddy/pki/authorities/local/root.crt; then
              break
            fi
            sleep 1
          done
          docker cp edge-caddy-tls-ci:/data/caddy/pki/authorities/local/root.crt /tmp/event-edge-root.crt
          verified=false
          for attempt in $(seq 1 30); do
            if echo | openssl s_client \
              -connect 127.0.0.1:18443 \
              -CAfile /tmp/event-edge-root.crt \
              -verify_ip 192.0.2.10 \
              -verify_return_error \
              -noservername >/tmp/edge-caddy-s_client.txt 2>&1 && \
              grep -q 'Verify return code: 0 (ok)' /tmp/edge-caddy-s_client.txt; then
              verified=true
              break
            fi
            sleep 1
          done
          if [ "$verified" != true ]; then
            cat /tmp/edge-caddy-s_client.txt
            exit 1
          fi
      - name: Validate venue Compose configuration
        env:
          CLOUD_API_URL: https://cloud-pilot.invalid
          EDGE_ID: edge-ci-placeholder
          EDGE_CLOUD_SYNC_TOKEN: edge-cloud-test-token-placeholder-0000
          EDGE_LOCAL_ADMIN_TOKEN: local-admin-test-token-placeholder-0000
          EDGE_POSTGRES_PASSWORD: postgres-test-password-placeholder-0000
          EDGE_LAN_HOST: 192.0.2.10
          EDGE_HTTPS_BIND_ADDRESS: 0.0.0.0
          EDGE_HTTPS_PORT: '8443'
          PILOT_EVENT_ID: 11111111-1111-4111-8111-111111111111
          PILOT_EVENT_END_AT: '2026-08-27T02:00:00+03:00'
          PILOT_SALES_LOCATION_ID: 22222222-2222-4222-8222-222222222222
          PILOT_INVENTORY_LOCATION_ID: 33333333-3333-4333-8333-333333333333
          PILOT_SKU_ID: 44444444-4444-4444-8444-444444444444
          PILOT_OPERATOR_ACTOR_ID: 55555555-5555-4555-8555-555555555555
          PILOT_OPENING_STOCK_BASE: '100'
          PILOT_OPENING_STOCK_OCCURRED_AT: '2026-08-26T17:00:00+03:00'
        run: docker compose -f infra/edge-pilot/compose.yml config --quiet
      - name: Stage exact-release Edge pilot validation evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/edge-pilot
          sha256sum \
            infra/edge-pilot/.env.example \
            infra/edge-pilot/Caddyfile \
            infra/edge-pilot/README.md \
            infra/edge-pilot/bootstrap.mjs \
            infra/edge-pilot/compose.yml \
            infra/edge-pilot/field-diagnostics.mjs \
            infra/edge-pilot/prepare-lan-https.ps1 \
            infra/edge-pilot/rehearsal.mjs \
            infra/edge-pilot/verify-lan-https.mjs \
            > artifacts/edge-pilot/bundle-files.sha256
          node <<'NODE'
          import { writeFileSync } from 'node:fs';

          const releaseCommit = process.env.RELEASE_COMMIT;
          if (!/^[0-9a-f]{40}$/.test(releaseCommit ?? '')) {
            throw new Error('RELEASE_COMMIT must be a lowercase 40-character Git SHA');
          }

          const evidence = {
            schemaVersion: 1,
            releaseCommit,
            workflowRunId: process.env.GITHUB_RUN_ID,
            repository: process.env.GITHUB_REPOSITORY,
            checks: [
              'exact-checkout',
              'helper-syntax',
              'caddy-config',
              'no-sni-lan-ip-certificate',
              'compose-config',
            ],
            result: 'PASS',
            validatedAt: new Date().toISOString(),
          };
          writeFileSync(
            'artifacts/edge-pilot/release-manifest.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
            { mode: 0o600 },
          );
          NODE
      - name: Upload Edge pilot validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v6
        with:
          name: event-edge-pilot-validation-${{ github.sha }}
          path: artifacts/edge-pilot/*
          if-no-files-found: error
          retention-days: 30
