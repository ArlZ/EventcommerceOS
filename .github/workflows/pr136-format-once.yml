name: PR 136 format once

on:
  push:
    branches:
      - agent/cloud-convergence-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/cloud-convergence-evidence
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/cloud-api/scripts/cloud-convergence-snapshot.mjs \
            scripts/cloud-convergence-evidence.mjs \
            scripts/cloud-convergence-evidence.test.mjs

      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/cloud-api/scripts/cloud-convergence-snapshot.mjs \
            scripts/cloud-convergence-evidence.mjs \
            scripts/cloud-convergence-evidence.test.mjs
          git commit -m 'Format Cloud convergence evidence'
          git push origin HEAD:agent/cloud-convergence-evidence
