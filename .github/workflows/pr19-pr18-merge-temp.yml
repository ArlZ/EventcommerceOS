name: PR19 final PR18 merge temporary

on:
  push:
    branches: [reliability/backup-restore-evidence]

permissions:
  contents: write

jobs:
  merge-base:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/backup-restore-evidence
          fetch-depth: 0
      - name: Merge final PR18 base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin security/abuse-controls
          set +e
          git merge --no-ff --no-edit origin/security/abuse-controls
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Merge conflicts:"
            git diff --name-only --diff-filter=U
            git status --short
            exit "$status"
          fi
      - name: Self-remove and push
        run: |
          git rm .github/workflows/pr19-pr18-merge-temp.yml
          git commit -m "Remove temporary PR19 final PR18 merge workflow"
          git push origin HEAD:reliability/backup-restore-evidence
